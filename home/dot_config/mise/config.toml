[tools]
# ── runtimes ── same as macos-dot-files, minus ruby@ios and tuist
python = "3.14.3"
uv = "0.11.6"
zig = "0.11.0"
go = "1.24.2"
node = "24.19.0"
rust = "latest"
fnox = "latest"
aube = "latest"

# ── terminal tools ── Homebrew provides these on the Mac. Ubuntu's apt is
# missing most of them, and mise has arm64 builds for the Pi.
sheldon = "latest"
starship = "latest"
zoxide = "latest"
atuin = "latest"
fzf = "latest"
eza = "latest"
bat = "latest"
delta = "latest"
fd = "latest"
ripgrep = "latest"
jq = "latest"
btop = "latest"
duf = "latest"
dust = "latest"
"github:dalance/procs" = "latest"
tealdeer = "latest"
yazi = "latest"
fastfetch = "latest"
neovim = "latest"
lazygit = "latest"
gh = "latest"

[settings]
# The Mac sets python.compile = true; on the Pi that means building Python
# from source, so take the prebuilt one.
python.uv_venv_auto = true
